<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5ef">
  <title>Daymark - Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f5ef;
      --surface: #fffefa;
      --ink: #202923;
      --muted: #737b72;
      --line: #e3e7de;
      --green: #28745a;
      --green-dark: #1d5e47;
      --mint: #e5f1e9;
      --coral: #c65e48;
      --shadow: 0 16px 40px rgb(32 41 35 / 6%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#dfe6dc 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "DM Sans", sans-serif;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .shell {
      width: min(100% - 40px, 720px);
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 58px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      color: white;
      background: var(--green);
      font-size: 16px;
      line-height: 1;
    }

    .local-note {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .local-note::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #55a477;
      content: "";
    }

    .intro { margin-bottom: 30px; }

    .date {
      margin: 0 0 9px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(36px, 8vw, 52px);
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.08;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .composer input {
      width: 100%;
      min-width: 0;
      padding: 9px 11px;
      border: 0;
      outline: 0;
      color: var(--ink);
      background: transparent;
      font-size: 15px;
    }

    .composer input::placeholder { color: #9aa198; }

    .composer:focus-within {
      border-color: #8cb9a0;
      box-shadow: 0 0 0 3px rgb(40 116 90 / 10%);
    }

    .add-button {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 8px;
      color: white;
      background: var(--green);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 140ms ease, transform 140ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: translateY(1px); }

    .list-panel {
      margin-top: 28px;
      border-top: 1px solid #dce2d9;
    }

    .list-toolbar {
      display: flex;
      min-height: 64px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .filter-button {
      min-height: 34px;
      padding: 0 11px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-button[aria-pressed="true"] {
      color: var(--green-dark);
      background: var(--mint);
    }

    .clear-button {
      padding: 7px 0 7px 8px;
      border: 0;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
      cursor: pointer;
    }

    .clear-button:hover:not(:disabled) { color: var(--coral); }
    .clear-button:disabled { opacity: 0.45; cursor: default; }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-row {
      display: grid;
      min-height: 62px;
      grid-template-columns: 22px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid var(--line);
      animation: arrive 180ms ease both;
    }

    .task-check {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-label {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 14px;
      line-height: 1.5;
    }

    .task-row.is-done .task-label {
      color: #929a91;
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .delete-button {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border: 0;
      border-radius: 7px;
      color: #8c958b;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .delete-button:hover {
      color: var(--coral);
      background: #f9eae6;
    }

    .empty-state {
      padding: 48px 16px 52px;
      color: var(--muted);
      text-align: center;
    }

    .empty-mark {
      display: grid;
      width: 44px;
      height: 44px;
      margin: 0 auto 13px;
      place-items: center;
      border-radius: 14px;
      color: var(--green);
      background: var(--mint);
      font-size: 20px;
    }

    .empty-state p { margin: 0; font-size: 14px; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid rgb(40 116 90 / 35%);
      outline-offset: 2px;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .shell { width: min(100% - 28px, 720px); padding-top: 22px; }
      .topbar { margin-bottom: 45px; }
      .local-note { font-size: 11px; }
      .list-toolbar { min-height: 60px; }
      .filters { gap: 0; }
      .filter-button { padding: 0 9px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Daymark home">
        <span class="brand-mark" aria-hidden="true">&#10003;</span>
        <span>daymark</span>
      </a>
      <span class="local-note">Saved on this device</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="date" id="today-date"></p>
      <h1 id="page-title">A little at a time.</h1>
      <p class="subtitle" id="remaining-count">Your day, one task at a time.</p>
    </section>

    <form class="composer" id="task-form">
      <input id="task-input" name="task" type="text" maxlength="240" placeholder="What needs doing?" autocomplete="off" aria-label="New task">
      <button class="add-button" type="submit">Add task</button>
    </form>

    <section class="list-panel" aria-label="Tasks">
      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="done" aria-pressed="false">Done</button>
        </div>
        <button class="clear-button" id="clear-completed" type="button" disabled>Clear completed</button>
      </div>
      <ul class="task-list" id="task-list" aria-live="polite"></ul>
    </section>
  </main>

  <script>
    const storageKey = "daymark.tasks.v1";
    const taskForm = document.querySelector("#task-form");
    const taskInput = document.querySelector("#task-input");
    const taskList = document.querySelector("#task-list");
    const remainingCount = document.querySelector("#remaining-count");
    const clearCompletedButton = document.querySelector("#clear-completed");
    const filterButtons = document.querySelectorAll("[data-filter]");
    let activeFilter = "all";
    let tasks = loadTasks();

    document.querySelector("#today-date").textContent = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "[]");
        if (!Array.isArray(saved)) return [];
        return saved.filter((task) =>
          task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean"
        );
      } catch {
        return [];
      }
    }

    function saveTasks() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(tasks));
      } catch {
        remainingCount.textContent = "Storage is unavailable in this browser.";
      }
    }

    function renderTasks() {
      const visibleTasks = tasks.filter((task) => {
        if (activeFilter === "active") return !task.completed;
        if (activeFilter === "done") return task.completed;
        return true;
      });
      const remaining = tasks.filter((task) => !task.completed).length;

      remainingCount.textContent = remaining === 1 ? "1 task left to do" : `${remaining} tasks left to do`;
      clearCompletedButton.disabled = !tasks.some((task) => task.completed);
      taskList.replaceChildren();

      if (visibleTasks.length === 0) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "empty-state";
        const mark = document.createElement("span");
        mark.className = "empty-mark";
        mark.setAttribute("aria-hidden", "true");
        mark.textContent = activeFilter === "done" ? "-" : "+";
        const message = document.createElement("p");
        message.textContent = activeFilter === "all"
          ? "Nothing on your list yet. Add a task to get started."
          : activeFilter === "active"
            ? "You are all caught up."
            : "Completed tasks will show up here.";
        emptyItem.append(mark, message);
        taskList.append(emptyItem);
        return;
      }

      for (const task of visibleTasks) {
        const item = document.createElement("li");
        item.className = `task-row${task.completed ? " is-done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.className = "task-check";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", `Mark ${task.text} ${task.completed ? "active" : "complete"}`);
        checkbox.addEventListener("change", () => {
          task.completed = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const label = document.createElement("span");
        label.className = "task-label";
        label.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.setAttribute("aria-label", `Delete ${task.text}`);
        deleteButton.title = "Delete task";
        deleteButton.textContent = "\u00d7";
        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter((savedTask) => savedTask.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, label, deleteButton);
        taskList.append(item);
      }
    }

    taskForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      tasks.unshift({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, text, completed: false });
      saveTasks();
      activeFilter = "all";
      filterButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));
      taskInput.value = "";
      renderTasks();
      taskInput.focus();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        filterButtons.forEach((filterButton) =>
          filterButton.setAttribute("aria-pressed", String(filterButton === button))
        );
        renderTasks();
      });
    });

    clearCompletedButton.addEventListener("click", () => {
      tasks = tasks.filter((task) => !task.completed);
      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
